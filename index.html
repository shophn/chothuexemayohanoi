       /* 1. Reset và Biến toàn cục */
       :root {
           --accent-default: #0A84FF;
           --accent2-default: #00C49A;
           --radius-main: 20px;
           --shadow-main: 0 4px 20px rgba(0, 0, 0, 0.1);

           --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           
           --transition-main: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
           
           /* Giá trị mặc định (sẽ được theme ghi đè) */
           --accent: var(--accent-default);
           --accent2: var(--accent2-default);
           --text-primary: #0c0d0f;
           --text-secondary: #555;
           --bg-primary: #f9fafa;
           --bg-secondary: #ffffff;
           --bg-glass: rgba(255, 255, 255, 0.7);
           --border-color: #eee;
           --shadow-color: rgba(0, 0, 0, 0.1);
       }

       *,
       *::before,
       *::after {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
       }

       html {
           scroll-behavior: smooth;
           -webkit-font-smoothing: antialiased;
           -moz-osx-font-smoothing: grayscale;
       }

       body {
           font-family: var(--font-main);
           background-color: var(--bg-primary);
           color: var(--text-primary);
           line-height: 1.6;
           transition: background-color 0.3s ease, color 0.3s ease;
           overflow-x: hidden;
       }

       /* 2. Định nghĩa Themes */

       /* 3. Cấu trúc App Shell */
       #app-wrapper {
           display: flex;
           flex-direction: column;
           min-height: 100vh;
       }

       #main-content {
           flex-grow: 1;
           padding-top: 70px; /* Offset cho header cố định */
       }

       /* Header (Menu) */
       #app-header {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           z-index: 1000;
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding: 10px 20px;
           background: var(--bg-glass);
           backdrop-filter: blur(var(--blur-main));
           -webkit-backdrop-filter: blur(var(--blur-main));
           border-bottom: 1px solid var(--border-color);
           transition: var(--transition-main);
       }

       .logo-container {
           display: flex;
           align-items: center;
           gap: 10px;
           text-decoration: none;
           color: var(--text-primary);
       }

       .logo {
           height: 40px;
           width: 40px;
           object-fit: cover;
           border-radius: 50%;
           border: 2px solid var(--accent);
       }

       /* SEO CHANGE: Logo Text is now SPAN, not H1 */
       .logo-text {
           font-size: 1rem;
           font-weight: 700;
           display: none;
           /* Thay đổi từ H1 thành text bình thường nhưng style giữ nguyên */
       }

       @media (min-width: 400px) {
           .logo-text {
               display: block;
           }
       }

       /* Menu Desktop */
       .desktop-nav {
           display: none;
           gap: 25px;
       }

       .desktop-nav a {
           text-decoration: none;
           color: var(--text-secondary);
           font-weight: 500;
           font-size: 0.95rem;
           transition: color 0.2s ease;
           position: relative;
           padding: 5px 0;
       }

       .desktop-nav a:hover {
           color: var(--accent);
       }
       
       .desktop-nav a::after {
           content: '';
           position: absolute;
           bottom: 0;
           left: 0;
           width: 0;
           height: 2px;
           background-color: var(--accent);
           transition: width 0.3s ease;
       }
       
       .desktop-nav a:hover::after {
           width: 100%;
       }

       /* Nút Menu Mobile */
       #menu-toggle {
           background: none;
           border: none;
           color: var(--text-primary);
           cursor: pointer;
           padding: 5px;
           display: flex;
           align-items: center;
           justify-content: center;
           z-index: 1002;
       }
       
       .material-symbols-rounded {
           font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
           font-size: 28px;
           transition: transform 0.3s ease;
       }

       /* Panel Menu Mobile */
       #mobile-nav {
           position: fixed;
           top: 0;
           left: -100%;
           width: 85%;
           max-width: 320px;
           height: 100%;
           background: var(--bg-secondary);
           z-index: 1001;
           transition: left 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
           display: flex;
           flex-direction: column;
           padding: 80px 30px 30px 30px;
           box-shadow: 5px 0 25px rgba(0,0,0,0.1);
       }
       
       #mobile-nav a {
           text-decoration: none;
           color: var(--text-primary);
           font-size: 1.2rem;
           font-weight: 600;
           padding: 15px 0;
           border-bottom: 1px solid var(--border-color);
           transition: color 0.2s ease;
       }
       
       #mobile-nav a:hover {
           color: var(--accent);
       }

       /* Khi menu mở */
       body.menu-open #mobile-nav {
           left: 0;
       }
       
       body.menu-open #menu-toggle .icon-menu {
           display: none;
       }
       
       body.menu-open #menu-toggle .icon-close {
           display: block;
       }

       .icon-close {
           display: none;
       }

       /* Footer (Mini Dock) - Chỉ cho mobile */
       #app-footer {

           bottom: 15px;
           left: 50%;

           border-radius: var(--radius-main);

           justify-content: space-around;
